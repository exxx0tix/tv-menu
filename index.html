<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; }
        img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <img id="menu" src="menu.jpg">
    <script>
        setInterval(() => {
            const img = document.getElementById('menu');
            img.src = 'menu.jpg?v=' + Date.now();
        }, 30000); // Проверяет обновление каждые 30 секунд
    </script>
</body>
</html>
